name: Build & Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Platform 37.0
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_SDK_PATH=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Prepare signing keystore and local.properties
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"

          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ] && \
             [ -n "${SIGNING_STORE_PASSWORD:-}" ] && \
             [ -n "${SIGNING_KEY_ALIAS:-}" ] && \
             [ -n "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "Restoring fixed release keystore from repository Actions Secrets."
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$KEYSTORE_PATH"
            export CFG_STORE_PASS="$SIGNING_STORE_PASSWORD"
            export CFG_KEY_ALIAS="$SIGNING_KEY_ALIAS"
            export CFG_KEY_PASS="$SIGNING_KEY_PASSWORD"
            echo "SIGNING_MODE=repository-secret" >> "$GITHUB_ENV"
          else
            echo "::notice::Signing secrets not present; generating ephemeral PKCS12 release keystore."
            EPHEMERAL_PASS="$(openssl rand -hex 20)"
            export CFG_STORE_PASS="$EPHEMERAL_PASS"
            export CFG_KEY_ALIAS="polyglotyt"
            export CFG_KEY_PASS="$EPHEMERAL_PASS"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$CFG_KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass:env CFG_STORE_PASS \
              -keypass:env CFG_KEY_PASS \
              -dname "CN=PolyglotYT CI, OU=Actions, O=PolyglotYT, C=CN" >/dev/null 2>&1
            echo "SIGNING_MODE=ephemeral-pkcs12" >> "$GITHUB_ENV"
          fi

          export CFG_STORE_FILE="$KEYSTORE_PATH"
          python3 - << 'PY'
          import os

          def esc(val: str) -> str:
              return (
                  val.replace("\\", "\\\\")
                  .replace("\n", "\\n")
                  .replace("\r", "\\r")
                  .replace(":", "\\:")
                  .replace("=", "\\=")
              )

          lines = [
              f"sdk.dir={esc(os.environ['ANDROID_SDK_PATH'])}",
              f"androidStoreFile={esc(os.environ['CFG_STORE_FILE'])}",
              f"androidStorePassword={esc(os.environ['CFG_STORE_PASS'])}",
              f"androidKeyAlias={esc(os.environ['CFG_KEY_ALIAS'])}",
              f"androidKeyPassword={esc(os.environ['CFG_KEY_PASS'])}",
          ]
          with open("local.properties", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
          unset CFG_STORE_FILE CFG_STORE_PASS CFG_KEY_ALIAS CFG_KEY_PASS

      - name: Run unit tests and assemble signed Release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          sh ./gradlew --no-daemon test assembleRelease

      - name: Verify signed APK and stage release assets
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SRC"

          APKSIGNER="$ANDROID_SDK_PATH/build-tools/36.0.0/apksigner"
          VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_SRC")"
          echo "$VERIFY_OUT"

          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test -n "$CERT_SHA256"
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          XPOSED_ENTRY="$(unzip -p "$APK_SRC" META-INF/xposed/java_init.list | tr -d '\r\n')"
          test -n "$XPOSED_ENTRY"
          echo "Verified Xposed entry in APK: $XPOSED_ENTRY"

          mkdir -p dist
          cp "$APK_SRC" dist/app-release.apk
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp "$APK_SRC" "dist/PolyglotYT-${GITHUB_REF_NAME}-signed.apk"
          else
            cp "$APK_SRC" "dist/PolyglotYT-release-signed.apk"
          fi
          (
            cd dist
            sha256sum ./*.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Clean up temporary signing files
        if: always()
        run: |
          rm -f local.properties "$RUNNER_TEMP/release.jks"

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolyglotYT-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
           (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=()
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE_FLAG=(--prerelease)
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" dist/* \
                --title "PolyglotYT $TAG" \
                --generate-notes \
                "${PRERELEASE_FLAG[@]}"
            fi
          else
            TAG="latest-build"
            NOTES="$(cat <<EOF
          Automated signed Release build from \`${GITHUB_REF_NAME}\` (\`${SHORT_SHA}\`).

          - **Commit**: \`${GITHUB_SHA}\`
          - **Signing mode**: \`${SIGNING_MODE}\`
          - **Certificate SHA-256**: \`${CERT_SHA256}\`
          - **Direct APK Download**: [PolyglotYT-release-signed.apk](https://github.com/${REPO}/releases/download/${TAG}/PolyglotYT-release-signed.apk)
          EOF
          )"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh api -X PATCH "repos/${REPO}/git/refs/tags/${TAG}" \
                -f sha="${GITHUB_SHA}" \
                -F force=true >/dev/null
              gh release edit "$TAG" \
                --title "PolyglotYT Latest Signed Build (${SHORT_SHA})" \
                --notes "$NOTES" \
                --prerelease
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" dist/* \
                --target "$GITHUB_SHA" \
                --title "PolyglotYT Latest Signed Build (${SHORT_SHA})" \
                --notes "$NOTES" \
                --prerelease
            fi
          fi
